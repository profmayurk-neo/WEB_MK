<script>
    //operators
    console.log(10+20); //addition
    console.log(10+'20'); //concate
    console.log(10*20); //multipy
    //for * - / implicit typecasting is pwerformed
    console.log(10*'20'); //internal typecasting happens
    console.log(10-'20');
    console.log(10/'20');
    console.log(5 ** 3); //exponential
    console.log(5%3); //modulus
</script>
