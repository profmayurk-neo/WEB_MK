<script>
    //named function
    function emi(p,r,n){
        n=n*12
        r=r/12/100
        //p X R X (1+R)^N/[(1+R)^N-1]
        let emivalue= (p*r*(1+r)**n)/((1+r)**n-1)
        console.log(emivalue)
        console.log(Math.round(emivalue)) //math library
    }
    //function call
    emi(2500000,8,30);

</script>
