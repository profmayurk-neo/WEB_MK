<script>
  let brands = ["Rajas", "Sonai", "Puma"];
  console.log(brands);
  brands.push("allen solie", "van husen"); //add at the end
  console.log(brands);
  brands.unshift("peter england", "nike"); //add at the start
  console.log(brands);
  brands.pop(); //remove last value
  console.log(brands); 
  brands.shift(); //first value remove
  console.log(brands);
  console.log(brands.includes('samsung')); //seraching return true/false
  console.log(brands.indexOf('nike')); //searching returns index number (if found) or -1(not found)
</script>
